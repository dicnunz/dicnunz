name: Read public Heesch fixtures
on:
  push:
    branches: [research/heesch-baseline-20260906]
    paths: [.github/workflows/heesch-public-fixtures.yml]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print published four-corona records only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, re, hashlib
          for n in [11,12,13,14,15,16,17]:
              url=f'https://cs.uwaterloo.ca/~csk/heesch/{n}hex_3up.txt'
              try:
                  data=urllib.request.urlopen(url, timeout=45).read()
              except Exception as e:
                  print('FETCH_FAILURE',n,type(e).__name__,str(e),flush=True)
                  continue
              print('SOURCE',url,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest(),flush=True)
              text=data.decode('utf-8')
              records=re.split(r'(?m)(?=^H )',text)
              count=0
              for record in records:
                  header=re.search(r'(?m)^~\s+(\d+)\s+(\d+)',record)
                  if header and int(header[1])>=4:
                      print('PUBLIC_FIXTURE_BEGIN',n,count,flush=True)
                      print(record.strip(),flush=True)
                      print('PUBLIC_FIXTURE_END',n,count,flush=True)
                      count+=1
              print('H4_COUNT',n,count,flush=True)
          PY
